<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 | Condicionales | SC-502</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <div class="contenedor">
            <p class="marca">Universidad Fidélitas | SC-502</p>
            <h1>Ejercicio 3: Estructura de control de flujo</h1>
            <p>Condicional if / else para evaluar la edad</p>
        </div>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2>Ingrese su edad</h2>
            <form id="formularioEdad" novalidate>
                <div class="campo">
                    <label for="edad">Edad (años)</label>
                    <input id="edad" type="number" min="0" max="120" step="1"
                           placeholder="Ej.: 20" aria-describedby="ayudaEdad">
                    <small id="ayudaEdad">Escriba un número entero entre 0 y 120.</small>
                </div>
                <button type="submit" class="boton boton-primario">Evaluar edad</button>
            </form>
            <p id="mensaje" class="mensaje resultado-edad" role="status" aria-live="polite"></p>
        </section>
    </main>
    <footer class="pie">SC-502 | Ejercicio 3 | JavaScript básico</footer>
</body>
</html>
